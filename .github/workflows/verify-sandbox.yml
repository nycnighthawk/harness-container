name: Verify Claude Code sandbox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # weekly: catch upstream Claude Code / base image changes

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning claude-sandbox.sh check-rootless.sh tests/run-tests.sh
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < Containerfile
          docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < proxy/Containerfile

  verify:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare rootless podman
        run: |
          set -x
          podman --version
          # restricted mode needs netavark + aardvark-dns (container-name DNS on internal networks)
          if [ "$(podman info --format '{{.Host.NetworkBackend}}')" != "netavark" ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q netavark aardvark-dns
            podman system reset -f
          fi
          podman info --format 'rootless={{.Host.Security.Rootless}} backend={{.Host.NetworkBackend}} cgroups={{.Host.CgroupsVersion}} controllers={{.Host.CgroupControllers}} rootlessNet={{.Host.RootlessNetworkCmd}}'
          grep "^$(id -un):" /etc/subuid /etc/subgid

      - name: Build sandbox image
        run: podman build -t claude-sandbox .

      - name: Build proxy image
        run: podman build -t claude-sandbox-proxy proxy/

      - name: Run verification suite
        env:
          # Optional: add these repository secrets to enable the live Claude tests.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: tests/run-tests.sh
