# Egress allowlist proxy for the Claude Code sandbox (restricted network mode).
# Only hosts matching a line in the Filter file can be reached; all else gets 403.
Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100

# Only containers on private (podman) networks may use this proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 127.0.0.1

# HTTPS tunnels only to port 443 (plus 80 for plain-HTTP package mirrors).
ConnectPort 443
ConnectPort 80

# Allowlist: one extended regex per line, matched against the host name.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes

LogLevel Connect
DisableViaHeader Yes
